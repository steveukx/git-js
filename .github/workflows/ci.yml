name: CI

on:
   push:
      branches: [main]
   pull_request:
      branches: [main]

permissions:
   contents: read

jobs:
   build-ubuntu:
      runs-on: ubuntu-latest
      strategy:
         matrix:
            node-version: [20, 22, 23, 24, 25]
      steps:
         - uses: actions/checkout@v7
         - uses: pnpm/setup@v2
           with:
              runtime: node@${{ matrix.node-version }}
              cache: true
         - run: pnpm build
         - name: Test
           env:
              GIT_AUTHOR_NAME: 'Simple Git Tests'
              GIT_AUTHOR_EMAIL: 'tests@simple-git.dev'
           run: pnpm test
         - run: pnpm build:pkg
         - run: pnpm test:consumer

   build-windows:
      runs-on: windows-latest
      steps:
         - uses: actions/checkout@v7
         - uses: pnpm/setup@v2
           with:
              runtime: node@24
              cache: true
         - run: pnpm build
         - name: Test
           env:
              GIT_AUTHOR_NAME: 'Simple Git Tests'
              GIT_AUTHOR_EMAIL: 'tests@simple-git.dev'
           run: pnpm test:win

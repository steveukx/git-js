name: Lint

on:
   push:
      branches: [main]
   pull_request:
      branches: [main]

permissions:
   contents: read

jobs:
   lint:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v7
         - uses: pnpm/setup@v2
           with:
              runtime: node@24
              cache: true
         - run: pnpm lint

name: Lint

on:
   push:
      branches: [main]
   pull_request:
      branches: [main]

permissions:
   contents: read

jobs:
   lint:
      runs-on: ubuntu-latest
      steps:
         - uses: actions/checkout@v6
         - uses: pnpm/action-setup@v4
           with:
              runtime: node24
              cache: true
         - run: pnpm install --frozen-lockfile
         - run: pnpm lint
